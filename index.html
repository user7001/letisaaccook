    main { max-width: 1900px; margin: 0 auto; }
    .collage { columns: 5; column-gap: 12px; }
    .collage img { display: block; width: 100%; height: auto; margin: 0 0 12px; break-inside: avoid; }
    @media (max-width: 1450px) { .collage { columns: 4; } }
    @media (max-width: 1050px) { .collage { columns: 3; } }
    @media (max-width: 700px) { body { padding: 8px; } .collage { columns: 2; column-gap: 8px; } .collage img { margin-bottom: 8px; } }
    @media (max-width: 380px) { .collage { columns: 1; } }
  </style>
</head>
