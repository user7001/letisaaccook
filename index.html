  <title>Isaac Lee — Photography</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000; }
    body { padding: 14px; color: #fff; }
    main { max-width: 1900px; margin: 0 auto; }
    .gallery { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; align-items: start; }
    .gallery img { display: block; width: 100%; height: auto; object-fit: contain; }
    @media (max-width: 760px) {
      body { padding: 8px; }
      .gallery { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
    }
    .gallery img[hidden] { display: none; }
  </style>
</head>
